<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="1" stop-color="#0c111d"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ea1ff"/>
      <stop offset="1" stop-color="#2f6fd0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- compass ring -->
  <circle cx="256" cy="248" r="150" fill="none" stroke="#26334a" stroke-width="14"/>
  <!-- N tick -->
  <text x="256" y="128" fill="#ff6a7a" font-family="system-ui, sans-serif" font-size="46" font-weight="700" text-anchor="middle">N</text>
  <!-- pointer needle -->
  <polygon points="256,150 292,296 256,272 220,296" fill="url(#pin)"/>
  <polygon points="256,346 292,296 256,320 220,296" fill="#ffd23f"/>
  <circle cx="256" cy="296" r="16" fill="#0c111d" stroke="#4ea1ff" stroke-width="8"/>
</svg>
